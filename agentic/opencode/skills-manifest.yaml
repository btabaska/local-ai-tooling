# Exact rebuild commands (installed 2026-08-06 from HEAD of each source repo):
install:
  installer: "Vercel skills CLI (skills.sh); agent dir claude-code -> ~/.claude/skills; -s flag repeats per skill (no comma lists)"
  commands:
    - "npx -y skills add anthropics/skills -g -y -a claude-code -s docx -s xlsx -s pptx -s pdf -s doc-coauthoring -s mcp-builder -s skill-creator -s webapp-testing"
    - "npx -y skills add obra/superpowers -g -y -a claude-code -s receiving-code-review -s using-git-worktrees"
    - "npx -y skills add trailofbits/skills -g -y -a claude-code -s audit-context-building -s differential-review -s entry-point-analyzer -s semgrep -s sarif-parsing -s supply-chain-risk-auditor"
    - "npx -y skills add akin-ozer/cc-devops-skills -g -y -a claude-code -s ansible-generator -s ansible-validator -s bash-script-generator -s bash-script-validator -s dockerfile-generator -s dockerfile-validator"
    - "npx -y skills add vercel-labs/skills -g -y -a claude-code -s find-skills"

curation:
  anthropics/skills: "doc + builder set only (8 of 18); Claude-platform/artifact skills (claude-api, brand-guidelines, canvas-design, web-artifacts-builder, ...) skipped. NO-REDISTRIBUTE: never commit their contents to any repo."
  obra/superpowers: "skills-only route (NOT the plugin/bootstrap path — non-lazy). EXCLUDED parallel/subagent-orchestration skills (dispatching-parallel-agents, subagent-driven-development — single-GPU llama-swap rule). 8 more superpowers-derived skills already exist as locally customized variants in opencode_config_skills below (brainstorming, writing-plans, executing-plans, systematic-debugging, test-driven-development, requesting-code-review, finishing-a-branch, verification-before-done) — do NOT reinstall the upstream versions on top (name collisions). writing-skills skipped (overlaps skill-creator). using-superpowers skipped (tied to the plugin route)."
  trailofbits/skills: "script-backed security-review picks only (6 of 76); fuzzing, blockchain scanners, codeql (needs CodeQL CLI) skipped."
  akin-ozer/cc-devops-skills: "6 fleet-relevant of 31: ansible + bash + dockerfile generator/validator pairs; k8s/terraform/helm/CI-pipeline skills skipped (not in this fleet)."
  vercel-labs/skills: "find-skills meta-skill (searches the skills.sh registry for new skills)."

# ~/.config/opencode/skills (both machines) — canonical source: agentic/opencode/skills/ in this repo.
opencode_config_skills:
  - name: brainstorming
  - name: compounding-learnings
  - name: executing-plans
  - name: finishing-a-branch
  - name: lfg
  - name: pr-summary
  - name: requesting-code-review
  - name: systematic-debugging
  - name: test-driven-development
  - name: verification-before-done
  - name: writing-plans

# Doc-skill system dependencies (reconciled against the installed SKILL.md files):
deps:
  mac:
    - "pandoc (brew)"
    - "LibreOffice (/Applications/LibreOffice.app; brew cask libreoffice)"
    - "python venv ~/.venvs/doc-skills: pypdf pdfplumber openpyxl defusedxml lxml pillow python-docx python-pptx"
    - "npm -g (homebrew prefix): docx pptxgenjs"
  rig:
    - "pandoc-cli (pacman)"
    - "libreoffice-fresh (pacman, pre-existing)"
    - "python venv ~/.venvs/doc-skills: pypdf pdfplumber openpyxl defusedxml lxml pillow python-docx python-pptx"
    - "npm -g --prefix ~/.local: docx pptxgenjs"
  notes:
    - "Skills may also `npm install docx|pptxgenjs` locally in a workdir at use-time — that is normal."
    - "Optional, NOT installed: pytesseract+pdf2image (+tesseract/poppler) for PDF OCR; markitdown; reportlab; pptx icon extras (react/react-dom/react-icons/sharp)."

parity:
  rig: "enforced by skills-manifest-parity (host: rig): ~/.claude/skills == claude_skills, ~/.config/opencode/skills == agentic/opencode/skills, total <= cap."
  mac: "same set installed 2026-08-06; not runner-reachable (accepted) — resync by hand: run the install commands above + copy agentic/opencode/skills -> ~/.config/opencode/skills."
