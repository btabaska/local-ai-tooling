# skills-manifest.yaml — canonical record of the curated agent-skills bundle (lai-06, 2026-08-06).
#
# Machines: Mac (MacBook) + rig (CachyOS). SAME set on both; opencode lazy-loads both roots.
# Two skill roots feed discovery (`opencode debug skill` lists 38 = 34 files + 4 built-ins):
#   1. ~/.claude/skills          — installed via the Vercel skills CLI
#      (`npx skills add <repo> -g -y -a claude-code -s <skill>...`). NOT vendored here:
#      the anthropics doc skills are source-available / NO-REDISTRIBUTE — this manifest
#      records NAMES ONLY; rebuild with the install commands below.
#   2. ~/.config/opencode/skills — pre-existing curated set, repo-canonical at
#      agentic/opencode/skills/ in THIS repo (deploy = copy the dir).
#
# Cap: <=40 skills per machine INCLUDING built-ins (arXiv:2602.16653 — skill misrouting
# grows as the catalog bloats; 30B-class models benefit only while the catalog stays lean).
# Rig live-state is enforced by verification check `skills-manifest-parity`
# (foss-setup/verification/checks.d/local-ai.yaml). The Mac is not runner-reachable —
# accepted gap, keep it in sync by hand with the same commands.

_meta:
  updated: 2026-08-06
  task: lai-06
  cap_total: 40
  count_claude_skills: 23
  count_opencode_config_skills: 11
  opencode_builtins: 4 # computer-use, customize-opencode, orca-cli, orchestration (runtime, version-dependent)

