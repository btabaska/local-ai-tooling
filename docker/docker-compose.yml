# ── docker/docker-compose.yml ────────────────────────────────────────────────
# The "app tier". Ollama stays NATIVE on the host (keeps direct GPU access + your existing
# tuning); everything here is CPU-only and talks to Ollama via host.docker.internal.
#
#   Bring up:   docker compose up -d
#   Logs:       docker compose logs -f
#   Update:     images are digest-pinned (lai-07) -- bump the @sha256 on the
#               service's image: line (docker manifest inspect <repo>:<tag>),
#               then docker compose up -d. A bare `docker compose pull` is a
#               no-op by design; nothing rolls silently anymore.
#   Stop:       docker compose down          (data persists in named volumes)
#
# Endpoints after startup (replace host with your AI_HOST / server IP):
#   Open WebUI     http://AI_HOST:3000
#   LiteLLM API    http://AI_HOST:4000            (OpenAI-compatible)
#   LiteLLM UI     http://AI_HOST:4000/ui         (login: admin / your master key)
#   mcpo tools     http://AI_HOST:8000/docs
#   LDR research   http://AI_HOST:5000            (local-deep-research, lai-08)
#   Kokoro TTS     http://AI_HOST:8880            (OpenAI-compatible /v1/audio/speech, lai-10)

services:
  # ---- Postgres: backs LiteLLM virtual keys + spend tracking (not exposed to LAN) ----
  litellm-db:
    image: postgres:16-alpine
    container_name: litellm-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - litellm_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---- LiteLLM: unified OpenAI-compatible gateway + auth + aliases ----
  litellm:
    # lai-07 (2026-08-06): pinned by digest (was rolling :main-latest; rev 229159c,
    # image built 2026-07-16). Re-resolve + bump to update.
    image: ghcr.io/berriai/litellm:main-latest@sha256:4d00db88fc8aba3e2c1cfaddbce6ae81f6de3b8826148e428ecbcc99b0a0f62b
    container_name: litellm
    restart: unless-stopped
    depends_on:
      litellm-db:
        condition: service_healthy
    ports:
      - "4000:4000"
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      LITELLM_SALT_KEY: ${LITELLM_SALT_KEY}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@litellm-db:5432/${POSTGRES_DB}
    volumes:
      - ./litellm-config.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml"]
    extra_hosts:
      - "host.docker.internal:host-gateway"   # lets the container reach host's native Ollama

  # ---- Open WebUI: the chat interface ----
  open-webui:
    # lai-07 pinned v0.10.2 by digest; lai-21 (2026-08-16): bumped to v0.11.0 (sub-agents,
    # startup-cached tool descriptions). Digest = tag v0.11.0 resolved 2026-08-16. Always
    # re-verify the PersistentConfig env-vs-DB seeds at any upgrade.
    image: ghcr.io/open-webui/open-webui:v0.11.0@sha256:72c0ba641ba75e7aa52655cb242570906ececd09b1140fb736483038a22b3228
    container_name: open-webui
    restart: unless-stopped
    ports:
      # LAN access; HTTPS via your reverse proxy (e.g. ai.example.com → this port).
      - "3000:8080"
    environment:
      # ai-01 cutover (2026-07-15): OWUI now rides LiteLLM (OpenAI-compatible)
      # -> llama-swap/llama.cpp. The native-Ollama connection is DISABLED; the
      # host Ollama that remains is a compat shim for HA Assist + Obsidian only.
      # NOTE: connection settings were verified NOT persisted in webui.db, so
      # these env vars are authoritative (the PersistentConfig caveat below
      # applies to the seeded web-search block, not to these).
      ENABLE_OLLAMA_API: "false"
      # API keys (Settings > Account) — needed by the wiki RAG sync (ai-01):
      ENABLE_API_KEYS: "true"
      OPENAI_API_BASE_URL: http://litellm:4000/v1
      OPENAI_API_KEY: ${OPENWEBUI_LITELLM_KEY}
      # Title/tag generation on the tiny utility alias instead of the chat model:
      TASK_MODEL_EXTERNAL: utility
      # Open Terminal code-exec backend (lai-09): seeds the terminal-server
      # connection on a FRESH volume only (PersistentConfig — DB wins once set;
      # live wiring done via POST /api/v1/configs/terminal_servers). The .env
      # seed line ships commented, so default to a harmless empty list — OWUI
      # json.loads() this at import and an empty string would crash it.
      TERMINAL_SERVER_CONNECTIONS: "[]"
      # ---- RAG embeddings via LiteLLM `embed` alias (nomic-embed-text) ----
      RAG_EMBEDDING_ENGINE: openai
      RAG_OPENAI_API_BASE_URL: http://litellm:4000/v1
      RAG_OPENAI_API_KEY: ${OPENWEBUI_LITELLM_KEY}
      RAG_EMBEDDING_MODEL: embed
      RAG_EMBEDDING_BATCH_SIZE: "32"
      # Qwen3-Embedding asymmetric retrieval: queries carry the instruct prefix,
      # documents do not (safe to change without re-embedding the docs):
      RAG_EMBEDDING_QUERY_PREFIX: "Instruct: Given a web search query, retrieve relevant passages that answer the query\nQuery: "
      # Stable secret so saved tool/OAuth creds survive restarts:
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY}
      # External URL Open WebUI advertises (absolute links, login redirects, PWA).
      WEBUI_URL: ${WEBUI_URL:-}
      # Household self-signup open 2026-08-14 (fleet is LAN/tailnet-only). These env
      # values only SEED a fresh DB — live values are PersistentConfig, flipped via
      # the admin API (/api/v1/auths/admin/config).
      ENABLE_SIGNUP: "true"
      DEFAULT_USER_ROLE: user
      # ── Web search (SearXNG on the mini, lai-01/lai-03) ────────────────────
      # NOTE: these are Open WebUI *PersistentConfig* vars — they only SEED a fresh
      # open_webui_data volume. Once a value exists in the DB it is authoritative and
      # these env vars are ignored on later boots (DB WINS). The live install was
      # switched via the admin REST API (see foss-setup wiki runbook
      # runbooks/owui-search-rag.md); these seeds are rebuild parity only.
      ENABLE_WEB_SEARCH: "true"
      WEB_SEARCH_ENGINE: searxng
      # NO &format=json suffix — OWUI strips it; the mini SearXNG serves
      # formats [html, json] already (lai-01).
      SEARXNG_QUERY_URL: "http://192.168.10.2:8888/search?q=<query>"
      # Kagi retired as the engine (lai-03) but the key stays vault-mapped for rollback:
      KAGI_SEARCH_API_KEY: ${KAGI_SEARCH_API_KEY:-}
      WEB_SEARCH_RESULT_COUNT: "5"
      WEB_SEARCH_CONCURRENT_REQUESTS: "5"
      # Inject full search results into context instead of RAG-chunk+retrieve. Fixes the
      # "search ran but model says no results" failure on large-context models. See SETUP.md.
      # (lai-03 fix: the old seed used BYPASS_EMBEDDING_AND_RETRIEVAL, which in OWUI
      # 0.10.x is the TOP-LEVEL RAG bypass — it would disable all document RAG on a
      # fresh volume. The web-search-scoped var is this one:)
      BYPASS_WEB_SEARCH_EMBEDDING_AND_RETRIEVAL: "true"
      # ── Hybrid RAG + external reranker (lai-02/lai-03) ─────────────────────
      # PersistentConfig too (DB WINS — applied live via admin API, seeds for rebuild).
      # Reranker = llama-swap qwen3-reranker (CPU, ggml-org Q8_0), container-network
      # address; externally the same endpoint is rig :9292/v1/rerank.
      ENABLE_RAG_HYBRID_SEARCH: "true"
      ENABLE_RAG_HYBRID_SEARCH_ENRICHED_TEXTS: "true"
      RAG_TOP_K: "20"
      RAG_TOP_K_RERANKER: "5"
      RAG_RERANKING_ENGINE: external
      RAG_RERANKING_MODEL: qwen3-reranker
      RAG_EXTERNAL_RERANKER_URL: http://llama-swap:8080/v1/rerank
      RAG_EXTERNAL_RERANKER_TIMEOUT: "120"
      # Text pipeline (lai-03): markdown-header splitter + merge tiny chunks up to
      # ~300 chars so header-split fragments don't pollute retrieval.
      ENABLE_MARKDOWN_HEADER_TEXT_SPLITTER: "true"
      CHUNK_MIN_SIZE_TARGET: "300"
      # ── Voice (lai-10): Kokoro TTS + mini faster-whisper STT ───────────────
      # PersistentConfig again (DB WINS after first boot — the live install was
      # wired via POST /api/v1/audio/config/update; these are rebuild seeds).
      # TTS: the kokoro container below, OpenAI-compatible, KEYLESS on the LAN
      # ("none" placeholder — OWUI just forwards it as a Bearer header).
      AUDIO_TTS_ENGINE: openai
      AUDIO_TTS_OPENAI_API_BASE_URL: http://kokoro:8880/v1
      AUDIO_TTS_OPENAI_API_KEY: none
      AUDIO_TTS_MODEL: kokoro
      AUDIO_TTS_VOICE: af_heart
      AUDIO_TTS_SPLIT_ON: punctuation
      # STT: the mini journaling stack's faster-whisper/speaches (host publish
      # :8010 -> container :8000, journal-04). Model must be one speaches has
      # cached (Systran/faster-whisper-small); keyless like Kokoro.
      AUDIO_STT_ENGINE: openai
      AUDIO_STT_OPENAI_API_BASE_URL: http://192.168.10.2:8010/v1
      AUDIO_STT_OPENAI_API_KEY: none
      AUDIO_STT_MODEL: Systran/faster-whisper-small
      # ── Image gen + edit = ComfyUI via the gpu-arbiter (lai-11) ────────────
      # PersistentConfig again (DB WINS after first boot — wired live via
      # POST /api/v1/images/config/update; these are rebuild seeds). Base URL is
      # the ARBITER (:8189), never bare comfyui:8188 — take-turns GPU protocol.
      # Gen = z-image-turbo (8-step, dpmpp_sde/beta, cfg 1); edit = flux-2-klein
      # instruction editing (ReferenceLatent, 20 steps, cfg 4). NOTE: the edit
      # node map has NO steps mapping ON PURPOSE — OWUI's edit path sends no
      # steps value and a mapped node would render None -> ComfyUI 400s.
      # Runbook: foss-setup wiki runbooks/image-browser-mcp.md.
      ENABLE_IMAGE_GENERATION: "true"
      IMAGE_GENERATION_ENGINE: comfyui
      IMAGE_GENERATION_MODEL: z_image_turbo_bf16.safetensors
      IMAGE_SIZE: 1024x1024
      IMAGE_STEPS: "8"
      COMFYUI_BASE_URL: http://gpu-arbiter:8189
      COMFYUI_WORKFLOW: '{"1":{"class_type":"CLIPLoader","inputs":{"clip_name":"qwen_3_4b.safetensors","type":"lumina2","device":"default"}},"2":{"class_type":"UNETLoader","inputs":{"unet_name":"z_image_turbo_bf16.safetensors","weight_dtype":"default"}},"3":{"class_type":"VAELoader","inputs":{"vae_name":"ae.safetensors"}},"4":{"class_type":"ModelSamplingAuraFlow","inputs":{"model":["2",0],"shift":3}},"5":{"class_type":"CLIPTextEncode","inputs":{"clip":["1",0],"text":"a scenic landscape"}},"6":{"class_type":"ConditioningZeroOut","inputs":{"conditioning":["5",0]}},"7":{"class_type":"EmptySD3LatentImage","inputs":{"width":1024,"height":1024,"batch_size":1}},"8":{"class_type":"KSampler","inputs":{"seed":7,"steps":8,"cfg":1.0,"sampler_name":"dpmpp_sde","scheduler":"beta","denoise":1.0,"model":["4",0],"positive":["5",0],"negative":["6",0],"latent_image":["7",0]}},"9":{"class_type":"VAEDecode","inputs":{"samples":["8",0],"vae":["3",0]}},"10":{"class_type":"SaveImage","inputs":{"filename_prefix":"owui_gen","images":["9",0]}}}'
      COMFYUI_WORKFLOW_NODES: '[{"type":"model","key":"unet_name","node_ids":["2"]},{"type":"prompt","key":"text","node_ids":["5"]},{"type":"width","key":"width","node_ids":["7"]},{"type":"height","key":"height","node_ids":["7"]},{"type":"steps","key":"steps","node_ids":["8"]},{"type":"seed","key":"seed","node_ids":["8"]}]'
      ENABLE_IMAGE_EDIT: "true"
      IMAGE_EDIT_ENGINE: comfyui
      IMAGE_EDIT_MODEL: flux-2-klein-9b-Q8_0.gguf
      IMAGE_EDIT_SIZE: 1024x1024
      IMAGES_EDIT_COMFYUI_BASE_URL: http://gpu-arbiter:8189
      IMAGES_EDIT_COMFYUI_WORKFLOW: '{"1":{"class_type":"UnetLoaderGGUF","inputs":{"unet_name":"flux-2-klein-9b-Q8_0.gguf"}},"2":{"class_type":"CLIPLoader","inputs":{"clip_name":"qwen_3_8b_fp8mixed.safetensors","type":"flux2","device":"default"}},"3":{"class_type":"VAELoader","inputs":{"vae_name":"flux2-vae.safetensors"}},"4":{"class_type":"LoadImage","inputs":{"image":"example.png"}},"5":{"class_type":"FluxKontextImageScale","inputs":{"image":["4",0]}},"6":{"class_type":"VAEEncode","inputs":{"pixels":["5",0],"vae":["3",0]}},"7":{"class_type":"CLIPTextEncode","inputs":{"clip":["2",0],"text":"edit instruction"}},"8":{"class_type":"ReferenceLatent","inputs":{"conditioning":["7",0],"latent":["6",0]}},"9":{"class_type":"CLIPTextEncode","inputs":{"clip":["2",0],"text":""}},"10":{"class_type":"EmptyFlux2LatentImage","inputs":{"width":1024,"height":1024,"batch_size":1}},"11":{"class_type":"KSamplerSelect","inputs":{"sampler_name":"euler"}},"12":{"class_type":"Flux2Scheduler","inputs":{"steps":20,"width":1024,"height":1024}},"13":{"class_type":"CFGGuider","inputs":{"model":["1",0],"positive":["8",0],"negative":["9",0],"cfg":4.0}},"14":{"class_type":"RandomNoise","inputs":{"noise_seed":424242}},"15":{"class_type":"SamplerCustomAdvanced","inputs":{"noise":["14",0],"guider":["13",0],"sampler":["11",0],"sigmas":["12",0],"latent_image":["10",0]}},"16":{"class_type":"VAEDecode","inputs":{"samples":["15",0],"vae":["3",0]}},"17":{"class_type":"SaveImage","inputs":{"filename_prefix":"owui_edit","images":["16",0]}}}'
      IMAGES_EDIT_COMFYUI_WORKFLOW_NODES: '[{"type":"model","key":"unet_name","node_ids":["1"]},{"type":"image","key":"image","node_ids":["4"]},{"type":"prompt","key":"text","node_ids":["7"]},{"type":"width","key":"width","node_ids":["10","12"]},{"type":"height","key":"height","node_ids":["10","12"]},{"type":"seed","key":"noise_seed","node_ids":["14"]}]'
    volumes:
      - open_webui_data:/app/backend/data
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ---- mcpo: bridges stdio MCP tool servers to OpenAPI ----
  # lai-04 (2026-08-05): Open WebUI now consumes fleet-mcp + context7 DIRECTLY as
  # native MCP tool servers (type mcp, streamable-HTTP; OWUI >=0.6.31) — see
  # scripts/seed-owui-tool-servers.sh (canonical connection list; PersistentConfig,
  # DB-only). mcpo keeps serving the stdio-only servers (time/fetch/serena/
  # sequential-thinking) to OWUI, and its /fleet + /context7 passthroughs stay up
  # for non-OWUI consumers. time+fetch pin mcp<2 in mcpo-config.json (SDK 2.0
  # renamed McpError -> MCPError and broke both at the 2026-08-03 reboot).
  # lai-13 (2026-08-06): + openzim (openzim-mcp==2.5.5, advanced mode) over /zim.
  mcpo:
    # lai-07 (2026-08-06): pinned by digest (was rolling :main; rev 788ff92,
    # image built 2026-02-27).
    image: ghcr.io/open-webui/mcpo:main@sha256:1e82c9555c19e50b80745705f32b47a2647589f35279527b5118ecd3a71bd467
    container_name: mcpo
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./mcpo-config.json:/app/config/config.json:ro
      # lai-13: NAS ZIM library (zim share -> rig /mnt/nas-zim RO CIFS mount) for openzim-mcp.
      - /mnt/nas-zim:/zim:ro
      # Mount your repos so serena (and any fs/git MCP) can reach them at /repos/<name>.
      # Set REPOS_PATH in .env; defaults to the common GitHub checkout dir.
      - ${REPOS_PATH:-/home/btabaska/Documents/GitHub}:/repos
    command: ["--host", "0.0.0.0", "--port", "8000", "--config", "/app/config/config.json"]
    extra_hosts:
      - "host.docker.internal:host-gateway"


  # ---- llama-swap: llama.cpp model server, on-demand load/unload (ai-01) ----
  # Replaces native Ollama for LiteLLM/OWUI/opencode. GPU via CDI (docker>=28,
  # /etc/cdi/nvidia.yaml generated by nvidia-ctk -- no daemon.json change).
  # Models are hardlinked ollama blobs + HF GGUFs in /opt/llm/models (NOT in
  # /home on purpose: restic must not back up re-pullable weights).
  # UI/activity: http://rig:9292/ui   Unload-all: POST /api/models/unload
  llama-swap:
    # lai-07 (2026-08-06): pinned by digest (was rolling :cuda). Re-resolve + bump to update.
    # 2026-08-15 bump: llama.cpp b10015 -> b10438 (Qwen3.8 GGUFs need >=b10419).
    # Post-bump regression sweep: MTP on qwen3.6-27b, swarm --reasoning flags,
    # reranker sigmoid scores (rerank-spread check), all big-group models.
    image: ghcr.io/mostlygeek/llama-swap:cuda@sha256:686afd4625e3728ed451c56fa09dd4ca544425fd12254aa6102d3eee56495706
    container_name: llama-swap
    restart: unless-stopped
    ports:
      - "9292:8080"
    devices:
      - nvidia.com/gpu=all
    volumes:
      - ./llama-swap-config.yaml:/app/config.yaml:ro
      - /opt/llm/models:/models:ro

  # ---- Lumiverse: creative/RP chat frontend (added 2026-07-18) -----------------
  # Self-hosted AI roleplay UI (prolix-oc/Lumiverse, TS+Bun). Rides LiteLLM like OWUI,
  # but the OpenAI-compatible connection is created IN-APP (Connections -> Custom):
  # API URL https://llm.tabaska.us/v1, key = LUMIVERSE_LITELLM_KEY (LiteLLM virtual key
  # scoped to cydonia/dolphin-venice/goetia — the only model restriction, since the app
  # has no allowlist), model name typed per connection. HTTPS via the mini Caddy
  # (lumiverse.tabaska.us -> rig:3001). Lumiverse ships no semver IMAGE tags (only
  # :latest / :staging-<sha>), so we pin :latest BY DIGEST (immutable) — resolved
  # 2026-07-18, past the v1.0.0 git release that patches the CVE-2026-44449 RCE cluster.
  # Re-resolve + bump the digest when updating. LAN/tailnet-only, never internet-exposed.
  lumiverse:
    image: ghcr.io/prolix-oc/lumiverse@sha256:baa8db4ed9e41b1db205bf48a77b4ff445a52585bbe698859253803f7f6b1991
    container_name: lumiverse
    restart: unless-stopped
    ports:
      - "3001:7860"
    environment:
      OWNER_USERNAME: admin
      OWNER_PASSWORD: ${LUMIVERSE_OWNER_PASSWORD}
      PORT: "7860"
      # Behind the mini Caddy: lock CORS to the real origin instead of TRUST_ANY_ORIGIN.
      TRUST_ANY_ORIGIN: "false"
      TRUSTED_ORIGINS: https://lumiverse.tabaska.us
      # Scoped LiteLLM virtual key (cydonia/dolphin-venice/goetia). Lumiverse has no
      # env-seeding, so the app never reads this; it is injected so
      # scripts/seed-lumiverse-connections.sh can rebuild the in-app connections
      # (LLM + 3 ComfyUI) after a volume wipe without hand-typing the key.
      LUMIVERSE_LITELLM_KEY: 
    volumes:
      # data/lumiverse.identity in here is the master key for stored secrets — back it up.
      - lumiverse-data:/app/data

  # ---- Marinara-Engine: creative/RP chat + game engine (added 2026-07-18) -------
  # Pasta-Devs/Marinara-Engine (ALPHA, AGPL-3.0). Reaches LiteLLM at https://llm.tabaska.us/v1
  # (needs PROVIDER_LOCAL_URLS_ENABLED=true — it's a private, non-loopback URL). The
  # OpenAI-compatible connection is created in-app with MARINARA_LITELLM_KEY (scoped to the
  # 3 RP models). HARDENING: behind a Docker reverse proxy, the default BYPASS_AUTH_DOCKER
  # would let forwarded traffic SKIP Basic Auth -> REQUIRE_AUTH_FOR_DOCKER_PROXY=true forces
  # it. Pinned to GHCR image 1.5.0 (the image semver line differs from the repo's git
  # tags); auto-update off; HTTPS via mini Caddy (marinara.tabaska.us -> rig:3002).
  marinara:
    image: ghcr.io/pasta-devs/marinara-engine:1.5.0
    container_name: marinara
    init: true
    restart: unless-stopped
    ports:
      - "3002:7860"
    environment:
      NODE_ENV: production
      DATA_DIR: /app/data
      FILE_STORAGE_DIR: /app/data/storage
      MARINARA_DOCKER: "true"
      HOST: 0.0.0.0
      PORT: "7860"
      AUTO_CREATE_DEFAULT_CONNECTION: "true"
      # Pin the image; disable in-app/git update paths for a managed deploy.
      AUTO_UPDATE_ENABLED: "false"
      UPDATES_APPLY_ENABLED: "false"
      UPDATES_ALLOW_REMOTE_APPLY: "false"
      # Allow reaching the internal LiteLLM (private, non-loopback) base URL.
      PROVIDER_LOCAL_URLS_ENABLED: "true"
      # Auth: THE ENFORCING GATE IS THE MINI CADDY (basic_auth on marinara.tabaska.us).
      # Marinara's own IP-based Basic Auth is structurally ineffective here: behind
      # Docker's userland-proxy the app only ever sees a trusted private/Docker source
      # (gateway 10.201.1.1 or a 10.201.1.x container IP), so it treats ALL callers as
      # trusted and skips auth — verified 2026-07-18 that no combination of
      # BASIC_AUTH_*, BYPASS_AUTH_DOCKER=false, BYPASS_AUTH_TAILSCALE=false, or
      # REQUIRE_AUTH_FOR_DOCKER_PROXY closes it (it cannot see the real client IP).
      # These vars are kept as defense-in-depth (they DO gate if userland-proxy is ever
      # disabled and real client IPs become visible). Loopback stays open for host tooling.
      BASIC_AUTH_USER: ${MARINARA_BASIC_AUTH_USER}
      BASIC_AUTH_PASS: ${MARINARA_BASIC_AUTH_PASS}
      BASIC_AUTH_REALM: Marinara-Engine
      BYPASS_AUTH_DOCKER: "false"
      REQUIRE_AUTH_FOR_DOCKER_PROXY: "true"
      BYPASS_AUTH_TAILSCALE: "false"
      IP_ALLOWLIST_ENABLED: "false"
      ADMIN_SECRET: ${MARINARA_ADMIN_SECRET}
      ENCRYPTION_KEY: ${MARINARA_ENCRYPTION_KEY}
      CSRF_TRUSTED_ORIGINS: https://marinara.tabaska.us
      CORS_ORIGINS: https://marinara.tabaska.us
      # Scoped LiteLLM virtual key (cydonia/dolphin-venice/goetia). Marinara 1.5.0
      # never reads this env; it is injected so scripts/seed-marinara-connections.sh
      # can rebuild the in-app connections (LLM + 3 ComfyUI) after a volume wipe.
      MARINARA_LITELLM_KEY: 
    volumes:
      - marinara-data:/app/data
      # PATCH pinned to image 1.5.0: CharacterTavern moved its card CDN; the shipped
      # code 403s on every card download. Patched copy lives in ./patches — REMOVE
      # this mount when bumping the image if upstream has fixed CT_CARDS_CDN.
      - ./patches/bot-browser-chartavern.routes.js:/app/packages/server/dist/routes/bot-browser-chartavern.routes.js:ro


  # ---- ComfyUI: image-generation backend (rig GPU via CDI) — added 2026-07-18 ----
  # RP image gen (Z-Image Turbo / NoobAI-XL anime / Flux.2 Klein), driven by Open WebUI,
  # Lumiverse and Marinara. Shares the single 3090 Ti with the LLM stack via gpu-arbiter
  # (take-turns: unload llama-swap before a gen, /free ComfyUI after). GPU via CDI like
  # llama-swap (rig has no nvidia docker runtime). BASE_DIRECTORY=/basedir -> models in
  # /opt/comfyui/models (outside /home, like /opt/llm). API + Manager UI on :8188.
  comfyui:
    # lai-07 (2026-08-06): pinned by digest (was rolling :latest; image built
    # 2026-06-06).
    image: mmartial/comfyui-nvidia-docker:latest@sha256:144dd59ffc29a7c384020eededde1dbfb66d81c6e072c912d51e58becfd3cd00
    container_name: comfyui
    restart: unless-stopped
    ports:
      - "8188:8188"
    devices:
      - nvidia.com/gpu=all
    environment:
      WANTED_UID: "1000"
      WANTED_GID: "1000"
      SECURITY_LEVEL: normal
      BASE_DIRECTORY: /basedir
      USE_UV: "true"
      # browser-side ComfyUI clients (Marinara/Lumiverse image gen) do cross-origin
      # XHR from *.tabaska.us -> ComfyUI must send CORS headers or the browser blocks it.
      COMFY_CMDLINE_EXTRA: "--enable-cors-header"
    volumes:
      - /opt/comfyui/run:/comfy/mnt
      - /opt/comfyui:/basedir

  # ---- gpu-arbiter: take-turns GPU sharing shim in front of ComfyUI --------------
  # The 24GB card can't hold a 73k-ctx 24B LLM (~22.8G) AND an image model at once.
  # This transparent reverse proxy force-unloads llama-swap on POST /prompt and /free's
  # ComfyUI when its queue drains, so image gen and chat alternate cleanly. Frontends
  # point their ComfyUI URL at this (:8189), NOT ComfyUI (:8188). Source: ./gpu-arbiter.py
  gpu-arbiter:
    image: python:3.12-slim
    container_name: gpu-arbiter
    restart: unless-stopped
    depends_on:
      - comfyui
    ports:
      - "8189:8189"
    command: ["sh", "-c", "pip install --quiet --no-cache-dir aiohttp && exec python /app/gpu-arbiter.py"]
    volumes:
      - ./gpu-arbiter.py:/app/gpu-arbiter.py:ro
    networks:
      default:
        # "comfyui-arbiter" alias: Marinara infers the comfyui image source only when
        # the base URL contains "comfyui" or ":8188" — frontends point at
        # http://comfyui-arbiter:8189 so routing works AND gens take turns with the LLMs.
        aliases:
          - comfyui-arbiter

  # ---- local-deep-research: iterative deep-research assistant (lai-08, 2026-08-06) ----
  # LearningCircuit/local-deep-research, pinned 1.10.1 BY DIGEST (re-resolve + bump to
  # update). CPU-only container; inference rides LiteLLM (provider openai_endpoint,
  # scoped virtual key) -> llama-swap on the shared GPU, so research is best-effort
  # under VRAM contention exactly like the journaling coach: by day the card is free,
  # at night Immich ML may hold it and coder-strong can OOM (llama-swap "exited
  # prematurely" -> LiteLLM 500). Search = the mini SearXNG JSON API (lai-01).
  # Web UI :5000 -> ldr.tabaska.us via the mini Caddy; auth = LDR app login
  # (per-user AES-256/SQLCipher DBs, registration open — LAN/tailnet posture like
  # lumiverse). NOTE the LDR_* vars below are settings OVERRIDES: a NON-EMPTY env
  # var beats the per-user settings DB on every boot and locks the field in the UI
  # (unlike OWUI PersistentConfig). Model changes = edit here, not in the UI.
  local-deep-research:
    image: localdeepresearch/local-deep-research:1.10.1@sha256:422230f302c2aa96844c2c575e23c4d40544651a6e8eba853ea84460892afc88
    container_name: local-deep-research
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      LDR_WEB_HOST: 0.0.0.0
      LDR_WEB_PORT: "5000"
      LDR_DATA_DIR: /data
      # LLM: LiteLLM as a custom OpenAI-compatible endpoint; research model =
      # coder-strong (qwen3.6-27b, the strong local model). The scoped key also
      # allows "fast" for lightweight-step use if a role split lands upstream.
      LDR_LLM_PROVIDER: openai_endpoint
      LDR_LLM_OPENAI_ENDPOINT_URL: http://litellm:4000/v1
      LDR_LLM_OPENAI_ENDPOINT_API_KEY: ${LDR_LITELLM_KEY}
      LDR_LLM_MODEL: coder-strong
      # Search: the mini SearXNG (JSON formats enabled server-side, lai-01).
      LDR_SEARCH_TOOL: searxng
      LDR_SEARCH_ENGINE_WEB_SEARXNG_DEFAULT_PARAMS_INSTANCE_URL: http://192.168.10.2:8888
    volumes:
      - ldr_data:/data
      - ldr_scripts:/scripts

  # ---- Kokoro-FastAPI: local TTS for Open WebUI voice (lai-10, 2026-08-06) ----
  # remsky/Kokoro-FastAPI v0.7.1, CPU variant, tag@digest pinned (re-resolve +
  # bump to update). CPU ON PURPOSE: the single 3090 Ti is contended
  # (rig-gpu-vram-contention) and short chat-reply synthesis is fine on CPU —
  # do NOT swap in the kokoro-fastapi-gpu image or add a devices: block.
  # Model weights + UniDic are BAKED into the image (no volume, no runtime
  # download; DEVICE=cpu / USE_GPU=false are image env). OpenAI-compatible
  # POST /v1/audio/speech (model "kokoro", voices at GET /v1/audio/voices,
  # default af_heart); OWUI's TTS engine reaches it by container name
  # (http://kokoro:8880/v1). KEYLESS BY DESIGN — LAN/tailnet posture like
  # llama-swap/comfyui: docker-published :8880, no Caddy vhost, no auth;
  # never expose it past the LAN. Consumer check: voice-roundtrip (mini).
  kokoro:
    image: ghcr.io/remsky/kokoro-fastapi-cpu:v0.7.1@sha256:2ff7f4d5ecd43efbd4216ee3f6f17f6d99693dbf0d3e19bac65e8adc2e9927cc
    container_name: kokoro
    restart: unless-stopped
    ports:
      - "8880:8880"


  # ---- comfyui-mcp: MCP tool server for ComfyUI image gen (lai-11, 2026-08-06) ----
  # joenorton/comfyui-mcp-server pinned at tag v1.1.1 via a git-SHA ARG in
  # ./comfyui-mcp/Dockerfile (no upstream image exists; the SHA pin is this
  # service's digest pin — bump COMFYUI_MCP_REF to update). Streamable-HTTP MCP
  # at :9000/mcp (stateless). Talks to the gpu-arbiter (:8189), NOT ComfyUI
  # (:8188), so every generation keeps the take-turns GPU protocol (LLM unload
  # before /prompt, /free after the queue drains). Curated workflow-backed tools
  # come from ./comfyui-mcp/workflows (mounted ro): zimage_turbo + noobai_anime,
  # each parameterizing ONLY prompt+seed (omitted optional PARAM_ placeholders
  # would leak into the graph as literal strings and fail ComfyUI validation).
  # LAN/tailnet posture like llama-swap: docker-published :9000, no vhost, no
  # auth — never expose past the LAN. Consumers: OWUI native MCP (3-tool filter,
  # scripts/seed-owui-tool-servers.sh) + opencode (full set). Check: mini
  # image-browser-mcp.
  comfyui-mcp:
    build: ./comfyui-mcp
    container_name: comfyui-mcp
    restart: unless-stopped
    depends_on:
      - gpu-arbiter
    ports:
      - "9000:9000"
    environment:
      COMFYUI_URL: http://gpu-arbiter:8189
      COMFY_MCP_WORKFLOW_DIR: /workflows
    volumes:
      - ./comfyui-mcp/workflows:/workflows:ro

  # ---- playwright-mcp: headless-browser MCP tool server (lai-11, 2026-08-06) ----
  # microsoft/playwright-mcp v0.0.79, tag@digest pinned (re-resolve + bump to
  # update). CPU-only headless chromium (the docker image supports nothing else);
  # --isolated so sessions never accumulate profile state; --no-sandbox is the
  # documented container invocation. Streamable-HTTP MCP at :8931/mcp.
  # LAN/tailnet posture: docker-published :8931, no vhost, no auth — NEVER expose
  # past the LAN (it will browse anywhere as this host). Consumers: OWUI native
  # MCP (8-tool filter) + opencode (full set). Check: mini image-browser-mcp.
  playwright-mcp:
    image: mcr.microsoft.com/playwright/mcp:v0.0.79@sha256:18c0a9c934004fe9580cc79f1e8e6e6cde7c667348b215335e8a23fd3e509804
    container_name: playwright-mcp
    restart: unless-stopped
    init: true
    entrypoint: ["node", "/app/cli.js"]
    # --allowed-hosts = DNS-rebinding guard on the Host header (403 otherwise):
    # compose-internal name (OWUI), LAN IP (mini runner/Mac), tailnet name+IP (opencode).
    command: ["--headless", "--browser", "chromium", "--no-sandbox", "--isolated", "--host", "0.0.0.0", "--port", "8931",
              "--allowed-hosts", "localhost:8931,127.0.0.1:8931,playwright-mcp:8931,192.168.10.12:8931,cachyos.tailb31641.ts.net:8931,100.68.237.117:8931"]
    ports:
      - "8931:8931"


volumes:
  litellm_pgdata:
  open_webui_data:
  lumiverse-data:
  marinara-data:
  ldr_data:
  ldr_scripts:
