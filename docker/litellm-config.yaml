# ── docker/litellm-config.yaml ───────────────────────────────────────────────
# LiteLLM = the single, stable, AUTHENTICATED front door to the AI stack.
#
# `model_name` is the PUBLIC alias every tool/script uses; the model underneath
# can change without touching any client. As of ai-01 (2026-07-14) everything
# routes to llama-swap (llama.cpp llama-server, on-demand load/unload) —
# native Ollama is demoted to a compat shim for HA Assist + Obsidian only and
# is NOT referenced here.
#
# llama-swap is reached container-to-container (http://llama-swap:8080/v1,
# same compose network). It serves an OpenAI-compatible API; `openai/<name>`
# routes through LiteLLM's OpenAI adapter. api_key is a placeholder (llama-swap
# is unauthenticated inside the compose network / LAN firewall).

model_list:
  # ---- Coding / agentic ----
  # Bake-off winner 2026-07-15 (see bakeoff/results/results.jsonl):
  # qwen3.6-35b-a3b — 3/3 tasks, 0 malformed tool calls, fewest turns,
  # 73-126 tok/s (vs 27b dense at 23-31 tok/s). 27b kept as coder-strong for
  # long/hard runs (community consensus pick for multi-hour reliability).
  - model_name: coder
    litellm_params: &coder
      model: openai/qwen3.6-35b-a3b
      api_base: http://llama-swap:8080/v1
      api_key: none
  # legacy alias, same target — existing clients keep working
  - model_name: code
    litellm_params: *coder

  # ---- Swarm coder: same weights as `coder`, 4 parallel slots (ai-10) ----
  # Use when running 2-4 concurrent agents. Point every agent in a swarm at THIS
  # alias — mixing aliases inside one swarm forces a ~19 GB llama-swap reload on
  # every delegation, since both entries are `big`/exclusive.
  # Single deep agent -> `coder`. Quality-critical single task -> `coder-strong`.
  - model_name: coder-swarm
    litellm_params:
      model: openai/qwen3.6-35b-a3b-swarm
      api_base: http://llama-swap:8080/v1
      api_key: none

  # ---- Strong/slow coder for long or gnarly tasks ----
  - model_name: coder-strong
    litellm_params:
      model: openai/qwen3.6-27b
      api_base: http://llama-swap:8080/v1
      api_key: none

  # ---- General chat (default) ----
  - model_name: chat
    litellm_params:
      model: openai/gemma4-31b-qat
      api_base: http://llama-swap:8080/v1
      api_key: none

  # ---- Creative / uncensored chat ----
  - model_name: chat-creative
    litellm_params:
      model: openai/deckard-heretic
      api_base: http://llama-swap:8080/v1
      api_key: none


  # ---- Creative / roleplay (Mistral-Small-24B family) added 2026-07-18 ----
  - model_name: cydonia
    litellm_params:
      model: openai/cydonia-24b
      api_base: http://llama-swap:8080/v1
      api_key: none

  - model_name: dolphin-venice
    litellm_params:
      model: openai/dolphin-venice-24b
      api_base: http://llama-swap:8080/v1
      api_key: none

  - model_name: goetia
    litellm_params:
      model: openai/goetia-24b
      api_base: http://llama-swap:8080/v1
      api_key: none

  # ---- Fast 7B: autocomplete / ops-agent inner loop / cheap tool routing ----
  - model_name: fast
    litellm_params:
      model: openai/qwen2.5-coder-7b
      api_base: http://llama-swap:8080/v1
      api_key: none

  # ---- Tiny utility: tagging, titles, classification (temp 0 baked) ----
  - model_name: utility
    litellm_params:
      model: openai/fast-3b
      api_base: http://llama-swap:8080/v1
      api_key: none

  # ---- Embeddings (RAG, semantic search) ----
  - model_name: embed
    litellm_params:
      model: openai/qwen3-embed
      api_base: http://llama-swap:8080/v1
      api_key: none

  # ---- Rerank (RAG second-stage scoring, lai-02) ----
  # llama.cpp/llama-swap serves a Jina/Cohere-style rerank API; LiteLLM's
  # `infinity` provider speaks that response shape and appends /rerank to
  # api_base -> http://llama-swap:8080/v1/rerank. Consume via POST /rerank
  # (or /v1/rerank) on LiteLLM :4000 — NOT chat/completions. Scores are
  # sigmoid-normalized 0..1. OWUI (lai-03) bypasses LiteLLM and
  # hits llama-swap :9292/v1/rerank directly; this alias is gateway parity so
  # every served model stays reachable through the front door (ai-08 lesson).
  - model_name: rerank
    litellm_params:
      model: infinity/qwen3-reranker
      api_base: http://llama-swap:8080/v1
      api_key: none


general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL

litellm_settings:
  drop_params: true          # silently drop provider-unsupported params instead of erroring
  request_timeout: 600       # cold model load + long agentic gens; llama-swap queues swaps

router_settings:
  routing_strategy: simple-shuffle
  num_retries: 2
