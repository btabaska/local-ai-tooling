# ── docker/llama-swap-config.yaml ────────────────────────────────────────────
# llama-swap: on-demand llama.cpp model server (replaces native Ollama, ai-01).
# Each model = one llama-server process, spawned on first request, unloaded on
# idle (ttl) or force-unloaded via POST /api/models/unload (the Apollo/gaming
# GPU-yield hook). Web UI + activity: http://rig:9292/ui
#
# GPU policy (game-13 successor): big models swap each other (one at a time),
# unload after 120s idle; the tiny embedder is persistent (262 MB). A game
# session force-unloads EVERYTHING via the admin endpoint — see
# scripts/gpu-yield-unload.sh and the Apollo global_prep_cmd.
#
# VRAM ground truth measured on THIS card 2026-07-14 (24564 MiB total):
# see ctx-size comments per model. q8_0 KV + flash-attn keeps KV ~half of f16.

healthCheckTimeout: 300
startPort: 10001

macros:
  "srv": >
    /app/llama-server
    --host 127.0.0.1 --port ${PORT}
    -ngl 999
    --flash-attn on
    --cache-type-k q8_0 --cache-type-v q8_0
    --jinja
    --no-webui

models:
  # ---- Coding / agentic candidates (bake-off pool, ai-01) ----
  # MTP self-speculative decoding (promoted 2026-07-15 after A/B bench):
  # 34.5 -> 50 tok/s (1.46x) with --spec-draft-n-max 2; n-max 3 was slower.
  # The #23658 2048-aligned-ctx acceptance bug did NOT manifest on b9994
  # (aligned == non-aligned in the bench), so ctx stays a round 98304
  # (21.5->22.2 GiB with MTP; ceiling measured: 131072 = 22.7 GiB, 163840 =
  # 24.0 GiB hard edge). Caveats: --parallel 1 is REQUIRED with MTP; do NOT
  # send images through this entry (llama.cpp #23233 crash); q8_0 KV ran the
  # bench clean but one upstream report crashed quantized KV + MTP after
  # ~20 min — if it ever wedges, drop the two cache-type flags first.
  "qwen3.6-27b":
    name: "Qwen3.6 27B MTP (dense, spec-decode ~50 t/s, 98k ctx)"
    cmd: |
      ${srv}
      --model /models/Qwen3.6-27B-MTP-UD-Q4_K_XL.gguf
      --ctx-size 98304
      --spec-type draft-mtp --spec-draft-n-max 2
      --parallel 1
    ttl: 120

  "qwen3.6-35b-a3b":
    name: "Qwen3.6 35B-A3B (MoE Q4, 23G weights — VRAM-tight)"
    cmd: |
      ${srv}
      --model /models/Qwen3.6-35B-A3B-UD-IQ4_NL_XL.gguf
      --ctx-size 131072
    ttl: 120

  "qwen3-coder-30b":
    name: "Qwen3 Coder 30B-A3B (MoE Q4, 18G weights)"
    cmd: |
      ${srv}
      --model /models/qwen3-coder-30b.gguf
      --ctx-size 65536
      --temp 0.1 --top-p 0.8
    ttl: 120

  "devstral-24b":
    name: "Devstral Small 24B (dense Q4, 14G weights)"
    cmd: |
      ${srv}
      --model /models/devstral-24b.gguf
      --ctx-size 65536
    ttl: 120

  # ---- Chat ----
  "gemma4-31b-qat":
    name: "Gemma 4 31B IT QAT (17G weights)"
    cmd: |
      ${srv}
      --model /models/gemma4-31b-qat.gguf
      --ctx-size 16384
    ttl: 120

  "deckard-heretic":
    name: "DECKARD-HERETIC 31B Q6 (creative, 20G weights — VRAM-tight)"
    cmd: |
      ${srv}
      --model /models/deckard-heretic.gguf
      --ctx-size 8192
    ttl: 120

  # ---- Small / utility ----
  "qwen2.5-coder-7b":
    name: "Qwen2.5 Coder 7B (autocomplete / cheap tool loop)"
    cmd: |
      ${srv}
      --model /models/qwen2.5-coder-7b.gguf
      --ctx-size 32768
    ttl: 300

  "fast-3b":
    name: "Llama 3.2 3B (tagging/titles/classification, temp 0)"
    cmd: |
      ${srv}
      --model /models/llama3.2-3b.gguf
      --ctx-size 8192
      --temp 0
    ttl: 300

  # ---- Embeddings (persistent, CPU — never contends with big models/games) ----
  # Qwen3-Embedding-0.6B replaced nomic 2026-07-15: nomic's 2048-token trained
  # ctx rejected big markdown-header chunks (OWUI RAG sync failures). Needs
  # --pooling last (Qwen3 style); no content/query prefixes (nomic-specific).
  # CPU on purpose (-ngl 0): at -ub 8192 on GPU the batch compute buffers ate
  # ~6.5GB and the 19.7GB coder no longer fit. A 0.6B embedder on 20 CPU
  # threads is plenty for query-time RAG + the nightly wiki sync, and the GPU
  # stays fully free. Encoder inputs must fit ONE ubatch -> 4096 covers the
  # largest observed wiki chunk (3136 tokens); bigger chunks fail that file
  # only (rare).
  "qwen3-embed":
    name: "Qwen3-Embedding-0.6B (RAG embeddings, CPU)"
    cmd: |
      /app/llama-server
      --host 127.0.0.1 --port ${PORT}
      -ngl 0 --threads 10
      --model /models/Qwen3-Embedding-0.6B-Q8_0.gguf
      --embeddings --pooling last
      --ctx-size 4096
      --batch-size 4096 --ubatch-size 4096
      --no-webui
    ttl: 3600

groups:
  # One big model at a time; loading one evicts the previous (NVMe reload is
  # seconds). The persistent embed group survives swaps.
  "big":
    swap: true
    exclusive: true
    members:
      - "qwen3.6-27b"
      - "qwen3.6-35b-a3b"
      - "qwen3-coder-30b"
      - "devstral-24b"
      - "gemma4-31b-qat"
      - "deckard-heretic"
      - "qwen2.5-coder-7b"
      - "fast-3b"
  "embed":
    swap: false
    exclusive: false
    persistent: true
    members:
      - "qwen3-embed"
