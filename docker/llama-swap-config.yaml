# ── docker/llama-swap-config.yaml ────────────────────────────────────────────
# llama-swap: on-demand llama.cpp model server (replaces native Ollama, ai-01).
# Each model = one llama-server process, spawned on first request, unloaded on
# idle (ttl) or force-unloaded via POST /api/models/unload (the Apollo/gaming
# GPU-yield hook). Web UI + activity: http://rig:9292/ui
#
# GPU policy (game-13 successor): big models swap each other (one at a time),
# unload after 120s idle; the embedder is persistent and pinned to CPU. A game
# session force-unloads EVERYTHING via the admin endpoint — see
# scripts/gpu-yield-unload.sh and the Apollo global_prep_cmd.
#
# Sampling defaults per model = the HF model-card recommended settings
# (2026-07-16 sweep). Clients can still override per request.
# ctx-size per model = MEASURED max that loads fully on GPU (bake-off
# 2026-07-16, q8_0 KV + flash-attn, embedder CPU-pinned, desktop ~1 GiB):
#   qwen3.6-27b MTP 114688 (23.4G; 131072 OOM)   35b-a3b 262144 = native max (23.3G)
#   gemma4-qat SPLIT 2026-08-17: text lane 65536 (22.1G; re-measured 2026-08-16:
#     73728 stopped fitting once desktop residents grew — ComfyUI CUDA ctx +
#     Apollo NVENC + Steam ~0.8G; 65536 leaves ~0.8G headroom; 81920 OOM);
#     -vision lane 49152+mmproj-F16 (57344+mmproj OOMed at the 1.14G clip
#     buffer — the vision tower costs two 8k ctx steps). Vision is Plant
#     Scout's lane only (operator decision 2026-08-17).
#   deckard 49152 (23.8G; 65536 OOM)
#   cydonia/dolphin-venice/goetia 73728 (22.8G; 81920 OOM) — identical Q5 24B
#   qwen2.5-coder 32768 = native max             fast-3b 131072 = native max
# These are edge fits (<1 GiB headroom) — the gaming force-unload hook is the
# safety valve, and any big VRAM desktop use (game client, big browser WebGL)
# can OOM a fresh load at these sizes.

healthCheckTimeout: 300
startPort: 10001

macros:
  "srv": >
    /app/llama-server
    --host 127.0.0.1 --port ${PORT}
    -ngl 999
    --flash-attn on
    --cache-type-k q8_0 --cache-type-v q8_0
    --jinja
    --no-webui

models:
  # ---- Coding / agentic (bake-off pool, ai-01) ----
  # MTP self-speculative decoding (promoted 2026-07-15 after A/B bench):
  # 34.5 -> 50 tok/s (1.46x) with --spec-draft-n-max 2; n-max 3 was slower.
  # Caveats: --parallel 1 is REQUIRED with MTP; do NOT send images through
  # this entry (llama.cpp #23233 crash); if quantized-KV + MTP ever wedges,
  # drop the two cache-type flags first.
  # HF card (thinking, precise coding): temp 0.6 top_p 0.95 top_k 20 min_p 0.
  "qwen3.6-27b":
    name: "Qwen3.6 27B MTP (dense, spec-decode ~50 t/s)"
    cmd: |
      ${srv}
      --model /models/Qwen3.6-27B-MTP-UD-Q4_K_XL.gguf
      --ctx-size 114688
      --spec-type draft-mtp --spec-draft-n-max 2
      --parallel 1
      --temp 0.6 --top-p 0.95 --top-k 20 --min-p 0
    ttl: 120

  # Qwen3.8-27B trial (2026-08-15, eval bake-off): unsloth UD-Q4_K_XL 17.9G,
  # post-Aug-14 template-fixed upload. HF card thinking samplers: temp 1.0
  # top_p 0.95 top_k 20 (NOTE: moved from 0.6 in the 3.6 gen). No MTP flags
  # yet (plain GGUF; -MTP companion untested on b10438). ctx conservative.
  "qwen3.8-27b":
    name: "Qwen3.8 27B (dense VLM, trial — text-only serving)"
    # reasoning_effort medium: the xhigh DEFAULT burned 600s/answer on evidence-
    # heavy ops questions (6/8 eval timeouts, 2026-08-16) — xhigh is unusable
    # interactively on this card; medium is the deployable posture.
    cmd: |
      ${srv}
      --model /models/qwen3.8-27b.gguf
      --ctx-size 98304
      --parallel 1
      --reasoning-effort medium
      --temp 1.0 --top-p 0.95 --top-k 20 --min-p 0
    ttl: 120

  # HF card (thinking, precise coding): temp 0.6 top_p 0.95 top_k 20 min_p 0.
  "qwen3.6-35b-a3b":
    name: "Qwen3.6 35B-A3B (MoE Q4, 23G weights — VRAM-tight)"
    cmd: |
      ${srv}
      --model /models/Qwen3.6-35B-A3B-UD-IQ4_NL_XL.gguf
      --ctx-size 262144
      --temp 0.6 --top-p 0.95 --top-k 20 --min-p 0
    ttl: 120

  # ---- SWARM profile: same weights, tuned for N concurrent agents (ai-10) ----
  # ADDITIVE — the single-slot entry above is unchanged and remains the default
  # `coder`. This one backs the `coder-swarm` LiteLLM alias. Roll back by
  # deleting this block + its group member + the alias.
  #
  # WHY A SECOND PROFILE: `--parallel 1` (required by MTP) is worst-case for a
  # swarm. Requests queue head-of-line instead of batching. MTP is deliberately
  # ABSENT here: it needs --parallel 1, and speculative drafting steals FLOPs
  # once the batch is already saturated.
  #
  # VRAM: --ctx-size is the TOTAL KV pool, divided across slots
  # (per_slot = n_ctx / n_parallel), so KV cost is FLAT in slot count.
  # Measured from the published config: this model is hybrid linear-attention —
  # only 10 of 40 layers hold real KV — so q8_0 KV is 10,240 B/token:
  #     196608 total = 49,152/slot = 1.88 GiB KV   (this profile)
  #     262144 total = 65,536/slot = 2.50 GiB KV   (the single-slot entry above)
  # Deliberately set BELOW the 262144 single-slot ceiling: --parallel 4 enlarges
  # the activation/batch buffers, and the 0.6 GiB saved on KV buys headroom for
  # them. These are <1 GiB-headroom fits — if this OOMs, drop to 131072 first.
  #
  # Measured 2026-07-30 (bakeoff/prefix-cache-probe.py): prefill 1,131 tok/s,
  # prefix caching CONFIRMED WORKING on this model (19.3x, 94.8% of prefill
  # eliminated on a repeated 13k-token prefix). That is what makes N agents
  # sharing one system prompt affordable: only the first pays the ~43s prefill
  # for a 49k context; the rest hit cache in ~0.6s.
  "qwen3.6-35b-a3b-swarm":
    name: "Qwen3.6 35B-A3B SWARM (4 slots x 49k, no MTP)"
    cmd: |
      ${srv}
      --model /models/Qwen3.6-35B-A3B-UD-IQ4_NL_XL.gguf
      --ctx-size 196608
      --parallel 4
      --reasoning off
      --temp 0.7 --top-p 0.8 --top-k 20 --min-p 0
    ttl: 120
    # REASONING IS OFF HERE, AND THE SAMPLER CHANGES WITH IT (ai-10, 2026-07-30).
    # Flag verified present in this build: `--reasoning [on|off|auto]`, plus
    # `--reasoning-budget N` and env LLAMA_ARG_REASONING.
    #
    # Why off on the SWARM profile only:
    #   - Measured on this rig: a max_tokens=5 request returned
    #     finish_reason="length" with content="" and the entire budget spent in
    #     reasoning_content. Output tokens are the scarce resource in a swarm
    #     (~0.4-0.7M tok/hr rig-wide), so thinking is a direct throughput tax.
    #   - Two documented llama.cpp failures are reasoning-triggered: #20260
    #     (prose before <tool_call> fails the PEG grammar -> HTTP 500) and
    #     #20809 (tool calls land in reasoning_content with finish_reason
    #     length). Both hit agent loops specifically.
    #   - It fits the intended topology: think in the SPINE (plan/decompose on
    #     `coder` / `coder-strong`, reasoning ON), execute in the RIBS. Ribs run
    #     pre-decomposed tasks; they do not need to re-derive the design.
    # `coder` (the single-slot entry above) keeps reasoning ON and stays 0.6/0.95.
    #
    # SAMPLER: Qwen3.x recommends different values per mode — thinking 0.6/0.95,
    # non-thinking (instruct) 0.7/0.80. Changing --reasoning WITHOUT changing the
    # sampler is a half-migration, so both moved together.
    # ⚠ Any client agent pointed at `coder-swarm` must therefore send temp 0.7 /
    #   top_p 0.8, or send nothing and inherit these. The existing `build`/`plan`
    #   agents send 0.6/0.95 — correct for `coder`/`coder-strong`, WRONG here.
    # Middle ground if quality suffers: swap `--reasoning off` for
    # `--reasoning-budget 512` (bounded thinking) and revert the sampler.
    #
    # OTHER OPTIONAL EXTRAS — verify each exists before enabling, since an
    # unknown flag stops llama-server from starting at all:
    #   docker compose exec llama-swap /app/llama-server --help | grep -E 'cache-reuse|cache-ram|kv-unified|backend-sampling'
    # Then append to cmd above:
    #   --cache-reuse 256      # reuse cache across a diverged middle chunk
    #                          # (agent loops insert tool results mid-prompt);
    #                          # reportedly defaults to 0 = OFF
    #   --cache-ram 24576      # MiB of system RAM for prompt-cache checkpoints.
    #                          # LOW PRIORITY here: at 10,240 B/token the 8 GiB
    #                          # default already holds ~840k tokens of
    #                          # checkpoints. Free, but not the lever it would
    #                          # be on a conventional-attention model.
    #   --backend-sampling     # moves sampling off the CPU. The 12700K already
    #                          # gives 10 threads to the embedder, and GPU util
    #                          # via llama-server is reportedly only ~60% vs
    #                          # 90-96% under llama-batched-bench, the gap being
    #                          # CPU-side sampling. Most likely to help at np>=4.

  # NOTE (ai-08, 2026-07-29): qwen3-coder-30b + devstral-24b were RETIRED here.
  # Both were served but had NO LiteLLM alias (gateway-unreachable), and the
  # bake-off already settled the coder slots (coder=35b-a3b, coder-strong=27b).
  # Their weights moved to /opt/llm/models/archive/ (see models.manifest.yaml
  # `archived:`) — restore by moving back + re-adding a model block if ever needed.

  # ---- Chat ----
  # Gemma 4 official: temp 1.0 top_p 0.95 top_k 64. n_ctx_train 262144 (SWA).
  # SPLIT 2026-08-17: vision moved to its own entry (Plant Scout is the only
  # deliberate vision consumer — operator decision). Text lane back to 65536
  # (the measured 2026-08-16 text-only fit: 22.1G, ~0.8G headroom under grown
  # desktop residents; 73728/81920 OOM). Same weights, two configs — llama-swap
  # swaps (unload/reload) when switching lanes; plant ID is occasional, fine.
  "gemma4-31b-qat":
    name: "Gemma 4 31B IT QAT (17G weights, text-only)"
    cmd: |
      ${srv}
      --model /models/gemma4-31b-qat.gguf
      --ctx-size 65536
      --temp 1.0 --top-p 0.95 --top-k 64
    ttl: 120

  # Vision lane (LiteLLM `chat-vision`, OWUI Plant Scout preset): the 2026-08-16
  # measured vision fit — 49152 + unsloth mmproj-F16; the 1.2G tower costs two
  # 8k ctx steps (57344+mmproj OOMed at the 1.14G clip buffer).
  "gemma4-31b-qat-vision":
    name: "Gemma 4 31B IT QAT (17G weights + mmproj vision)"
    cmd: |
      ${srv}
      --model /models/gemma4-31b-qat.gguf
      --mmproj /models/mmproj-gemma-4-31b-qat-f16.gguf
      --ctx-size 49152
      --temp 1.0 --top-p 0.95 --top-k 64
    ttl: 120

  # DavidAU DECKARD-HERETIC finetune of Gemma-4-31B, Q4_K_M GGUF by mradermacher
  # (sha256-verified against models.manifest.yaml, 2026-07-29). DavidAU card
  # defers to Gemma 4 org settings: temp 1.0 top_p 0.95 top_k 64.
  # (Prior label said "Q6/20G" — wrong: header is file_type 15 = Q4_K_M, 17.4 GiB.)
  "deckard-heretic":
    name: "DECKARD-HERETIC 31B Q4_K_M (creative, 17G weights — VRAM-tight)"
    cmd: |
      ${srv}
      --model /models/deckard-heretic.gguf
      --ctx-size 49152
      --temp 1.0 --top-p 0.95 --top-k 64
    ttl: 120

  # ---- Small / utility ----
  # Qwen2.5 generation_config: temp 0.7 top_p 0.8 top_k 20 rep 1.05.
  # Native n_ctx_train is 32768 (131k only via YaRN, degrades short-ctx).
  "qwen2.5-coder-7b":
    name: "Qwen2.5 Coder 7B (autocomplete / cheap tool loop)"
    cmd: |
      ${srv}
      --model /models/qwen2.5-coder-7b.gguf
      --ctx-size 32768
      --temp 0.7 --top-p 0.8 --top-k 20 --repeat-penalty 1.05
    ttl: 300

  # temp 0 on purpose (deterministic tagging/titles). n_ctx_train 131072.
  "fast-3b":
    name: "Llama 3.2 3B (tagging/titles/classification, temp 0)"
    cmd: |
      ${srv}
      --model /models/llama3.2-3b.gguf
      --ctx-size 131072
      --temp 0
    ttl: 300

  # ---- Embeddings (persistent, CPU — never contends with big models/games) ----
  # Qwen3-Embedding-0.6B replaced nomic 2026-07-15 (nomic's 2048 trained ctx
  # rejected big markdown-header chunks). --pooling last (Qwen3 style).
  # CUDA_VISIBLE_DEVICES="" pins it truly off-GPU: with -ngl 0 alone the CUDA
  # backend still allocated ~2.8 GiB of batch compute buffers on the card
  # (observed 2026-07-16), which silently shrank every big model's ctx budget.
  # Encoder inputs must fit ONE ubatch -> 4096 covers the largest observed
  # wiki chunk (3136 tokens); bigger chunks fail that file only (rare).
  "qwen3-embed":
    name: "Qwen3-Embedding-0.6B (RAG embeddings, CPU)"
    env:
      - "CUDA_VISIBLE_DEVICES="
    cmd: |
      /app/llama-server
      --host 127.0.0.1 --port ${PORT}
      -ngl 0 --threads 10
      --model /models/Qwen3-Embedding-0.6B-Q8_0.gguf
      --embeddings --pooling last
      --ctx-size 4096
      --batch-size 4096 --ubatch-size 4096
      --no-webui
    ttl: 3600

  # ---- Reranker (CPU, on-demand — RAG second-stage scoring, lai-02) ----------
  # Official ggml-org GGUF ONLY: community Qwen3-Reranker conversions are broken
  # (missing the yes/no-token classification head wiring -> near-zero scores for
  # everything). Deep-research verdict 2026-08-05 (local-claude-buildout).
  # SEPARATE llama-server process from qwen3-embed on purpose: rank pooling
  # (--rerank) cannot share a process with --embeddings/--pooling last.
  # Same CPU discipline as the embedder: -ngl 0 + CUDA_VISIBLE_DEVICES="" so it
  # never takes VRAM from the big models (see rig-gpu-vram-contention).
  # Each query+document pair must fit one batch -> 4096 matches the embedder.
  # Consumer: OWUI RAG_RERANKING_ENGINE=external -> :9292/v1/rerank (lai-03).
  # Scores are sigmoid-normalized 0..1 in this build (b10015; measured live
  # 2026-08-05: relevant 0.9945 vs irrelevant 0.000026). Near-zero for
  # EVERYTHING = the broken-community-GGUF failure mode (rerank-spread check).
  "qwen3-reranker":
    name: "Qwen3-Reranker-0.6B (RAG rerank, CPU)"
    env:
      - "CUDA_VISIBLE_DEVICES="
    cmd: |
      /app/llama-server
      --host 127.0.0.1 --port ${PORT}
      -ngl 0 --threads 10
      --model /models/qwen3-reranker-0.6b-q8_0.gguf
      --rerank
      --ctx-size 4096
      --batch-size 4096 --ubatch-size 4096
      --no-webui
    ttl: 3600
    capabilities:
      reranker: true

  # ---- Creative / roleplay (Mistral Small 24B family, Mistral v7 "Tekken") ----
  # Added 2026-07-18. All three are Mistral-Small-3.2-24B RP/creative models, Q5_K_M
  # (~16.8G weights), Tekken chat template served via the embedded jinja template
  # (--jinja is in ${srv}). DRY sampler on to curb long-chat repetition.
  # VISION enabled 2026-07-18: shared mmproj (base Mistral-Small-3.2-2506 vision
  # tower, unsloth mmproj-F16, 838M) — one file serves all three finetunes. The
  # tower + its compute buffer cost ~1.3G VRAM, so ctx dropped 73728 -> 61440
  # (73728 was the measured TEXT-ONLY ceiling: 22.8G, 1.2G free; 81920 OOMs;
  # 65536+mmproj measured 22.65G server = only 0.5G free with desktop overhead —
  # 61440 restores the ~1.1G headroom norm). Still an edge fit; the Apollo
  # gaming force-unload remains the safety valve.

  # TheDrummer Cydonia 24B v4.3. Repo: TheDrummer/Cydonia-24B-v4.3-GGUF
  # (file Cydonia-24B-v4zg-Q5_K_M.gguf). HF card specifies NO sampler -> Mistral-24B
  # RP community defaults. n_ctx_train 131072. Optional <thinking> supported (unused).
  "cydonia-24b":
    name: "Cydonia 24B v4.3 (creative/RP, Mistral-Small-24B, 17G)"
    cmd: |
      ${srv}
      --model /models/cydonia-24b.gguf
      --mmproj /models/mmproj-mistral-small-3.2-f16.gguf
      --ctx-size 61440
      --temp 1.0 --top-p 0.95 --top-k 0 --min-p 0.05 --repeat-penalty 1.05
      --dry-multiplier 0.8 --dry-base 1.75 --dry-allowed-length 2
    ttl: 120

  # Dolphin-Mistral 24B Venice Edition. Repo:
  # bartowski/cognitivecomputations_Dolphin-Mistral-24B-Venice-Edition-GGUF.
  # Ships near-unaligned/uncensored: behavior is set by the SYSTEM PROMPT. HF card
  # recommends temp 0.15 (factual/assistant use); raised to 0.7 for creative/RP intent
  # here -- override per-request downward for factual tasks. n_ctx_train 131072.
  "dolphin-venice-24b":
    name: "Dolphin-Mistral 24B Venice (uncensored/steerable, 17G)"
    cmd: |
      ${srv}
      --model /models/dolphin-venice-24b.gguf
      --mmproj /models/mmproj-mistral-small-3.2-f16.gguf
      --ctx-size 61440
      --temp 0.7 --top-p 0.95 --top-k 0 --min-p 0.05 --repeat-penalty 1.05
      --dry-multiplier 0.8 --dry-base 1.75 --dry-allowed-length 2
    ttl: 120

  # Goetia 24B v1.3 (DELLA merge of 33 Mistral-Small-3.2-24B RP tunes, dark/edgy RP).
  # Repo: mradermacher/Goetia-24B-v1.3-GGUF (file Goetia-24B-v1.3.Q5_K_M.gguf). No card
  # sampler -> Mistral-24B RP defaults; hot merge so temp kept <=1.0. n_ctx_train 131072.
  "goetia-24b":
    name: "Goetia 24B v1.3 (dark RP merge, Mistral-Small-24B, 17G)"
    cmd: |
      ${srv}
      --model /models/goetia-24b.gguf
      --mmproj /models/mmproj-mistral-small-3.2-f16.gguf
      --ctx-size 61440
      --temp 0.8 --top-p 0.95 --top-k 0 --min-p 0.05 --repeat-penalty 1.05
      --dry-multiplier 0.8 --dry-base 1.75 --dry-allowed-length 2
    ttl: 120

groups:
  # One big model at a time; loading one evicts the previous (NVMe reload is
  # seconds). The persistent embed group survives swaps.
  "big":
    swap: true
    exclusive: true
    members:
      - "qwen3.6-27b"
      - "qwen3.8-27b"   # 2026-08-15 trial
      - "qwen3.6-35b-a3b"
      - "qwen3.6-35b-a3b-swarm"   # ai-10; same weights, --parallel 4 profile
      - "gemma4-31b-qat"
      - "deckard-heretic"
      - "cydonia-24b"
      - "dolphin-venice-24b"
      - "goetia-24b"
      - "qwen2.5-coder-7b"
      - "fast-3b"
  "embed":
    swap: false
    exclusive: false
    persistent: true
    members:
      - "qwen3-embed"
      - "qwen3-reranker"   # lai-02; separate CPU process, coexists with the embedder
