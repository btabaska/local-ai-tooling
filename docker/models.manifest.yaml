# ── docker/models.manifest.yaml ─────────────────────────────────────────────
# Model-weight manifest for the rig's local AI stack (ai-06).
#
# WHY THIS FILE EXISTS: the GGUF weights in /opt/llm/models are DELIBERATELY
# excluded from restic (too large — ~160 GB). That is correct, but it left the
# weights un-inventoried, so the stack was NOT provably rebuildable after an
# NVMe loss (which GGUF? from where? what quant? intact?). This manifest is the
# integrity + provenance record that closes that gap: for every GGUF actually
# served by docker/llama-swap-config.yaml, it records the on-disk filename,
# byte size, sha256 (the integrity anchor), source (HF repo + upstream file),
# quant, and which llama-swap model name + LiteLLM public alias it backs.
#
# REBUILD PATH: scripts/fetch-models.sh re-downloads this set into
# /opt/llm/models and verifies each sha256. See the `restore` section at the
# bottom, and the `ollama_shim` section for the 3 Ollama-store models.
#
# SOURCE OF TRUTH: the LIVE stack. Cross-checked 2026-07-29 against
# docker/llama-swap-config.yaml (--model paths) + docker/litellm-config.yaml
# (aliases). Regenerate hashes with:  cd /opt/llm/models && sha256sum *.gguf
#
# CONFIDENCE on `source.repo`:
#   verified  = HF repo/quantizer embedded in the GGUF header (general.repo_url
#               / general.quantized_by) or named verbatim in llama-swap-config.
#   inferred  = repo deduced from base model + quantizer + quant; the on-disk
#               file was renamed, so confirm the exact upstream file by matching
#               sha256/size after download (fetch-models.sh does this).
# ────────────────────────────────────────────────────────────────────────────

meta:
  host: rig (CachyOS, RTX 3090 Ti 24GB)
  models_dir: /opt/llm/models
  served_by: docker/llama-swap-config.yaml  # llama.cpp llama-server, on-demand swap
  gateway: docker/litellm-config.yaml        # LiteLLM :4000 public aliases
  captured: 2026-07-29
  file_type_legend:  # ggml LLAMA_FTYPE -> quant (for reference)
    2: Q4_0
    7: Q8_0
    15: Q4_K_M
    17: Q5_K_M
    25: IQ4_NL
  notes:
