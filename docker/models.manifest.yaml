# ── Ollama shim models (Ollama's OWN store, NOT /opt/llm/models) ─────────────
# Demoted to a 3-model compat shim on :11434 for HA Assist + Obsidian only
# (see README + scripts/03-model-variants.sh). Rebuild path = ollama pull/create.
ollama_shim:
  store: ~/.ollama (Ollama-managed blobs; not in /opt/llm/models, not in restic)
  models:
    - name: llama3.2:3b
      size: ~2.0 GB
      restore: "ollama pull llama3.2:3b"
    - name: nomic-embed-text:latest
      size: ~274 MB
      restore: "ollama pull nomic-embed-text"
    - name: tag:fast
      size: ~2.0 GB
      derived_from: llama3.2:3b
      restore: |
        # created by scripts/03-model-variants.sh (num_ctx 8192, temp 0):
        printf 'FROM llama3.2:3b\nPARAMETER num_ctx 8192\nPARAMETER temperature 0\n' > /tmp/Modelfile.tag
        ollama create tag:fast -f /tmp/Modelfile.tag

